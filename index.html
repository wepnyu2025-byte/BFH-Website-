<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/BFH-logo.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/BFH-logo.svg" />
    <title>Baby First Health - Parenting and Child Health Education</title>
    <meta name="description" content="Practical guidance for parents of children aged 0 to 5 on child health, parenting, nutrition, safety and family wellbeing." />
    <meta property="og:title" content="Baby First Health - Parenting and Child Health Education" />
    <meta property="og:description" content="Practical guidance for parents of children aged 0 to 5 on child health, parenting, nutrition, safety and family wellbeing." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white text-teal-950 antialiased font-body selection:bg-teal-200 selection:text-teal-950">
    <!-- Netlify Forms static detection declarations for React SPA -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
    </form>

    <form name="certification-application" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="courseId" />
      <input type="text" name="courseTitle" />
      <input type="text" name="nameAsOnId" />
      <input type="text" name="country" />
      <input type="text" name="placeOfBirth" />
      <input type="text" name="profession" />
      <input type="text" name="academicLevel" />
      <input type="email" name="email" />
      <input type="tel" name="contactNumber" />
      <input type="text" name="sessionPreference" />
      <textarea name="learningGoals"></textarea>
      <input type="text" name="referralSource" />
    </form>

    <form name="faq-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="topic" />
      <textarea name="question"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
